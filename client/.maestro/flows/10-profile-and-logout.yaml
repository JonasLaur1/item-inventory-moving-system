appId: com.jonaslaur.boxit
---
# TC-10: Profile settings and logout
# Verifies:
#   a) Profile screen is reachable and shows account section
#   b) Theme can be switched (Device → Dark → Light)
#   c) Log Out button returns user to the login screen

- launchApp:
    clearState: true

- assertVisible: "Sign In"

- tapOn:
    text: "El. pašto adresas"
- inputText: "boxit.test@gmail.com"

- tapOn:
    text: "Slaptažodis"
- inputText: "BoxitTest123!"

- tapOn: "Sign In"

- extendedWaitUntil:
    visible:
      text: "Home"
    timeout: 8000

# Profile is accessed via a header icon on the Home tab.
# The icon is a Feather "user" icon — tap by accessibility or position.
# If your build has a testID, replace the selector below accordingly.
- tapOn:
    text: "Home"

- waitForAnimationToEnd

# Tap the profile / avatar icon in the top-right header area
- tapOn:
    id: "profile-button"
    optional: true

# Fallback: if no testID, the screen may be accessible from a pressable avatar
- waitForAnimationToEnd

- assertVisible: "Profile & Settings"
- assertVisible: "Account"
- assertVisible: "Theme"

# --- Part A: Switch theme to Dark ---
- tapOn: "Dark"

- waitForAnimationToEnd

# --- Part B: Switch theme to Light ---
- tapOn: "Light"

- waitForAnimationToEnd

# --- Part C: Switch back to Device ---
- tapOn: "Device"

- waitForAnimationToEnd

# --- Part D: Log out ---
- tapOn: "Log Out"

- waitForAnimationToEnd

# After logout the login screen should appear
- extendedWaitUntil:
    visible:
      text: "Sign In"
    timeout: 6000

- assertVisible: "BoxIt"
- assertVisible: "Sign In"
