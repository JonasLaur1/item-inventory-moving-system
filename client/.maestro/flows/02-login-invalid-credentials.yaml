appId: com.jonaslaur.boxit
---
# TC-02: Login with invalid credentials
# Verifies that entering a wrong password shows an error message
# and does NOT navigate away from the login screen.

- launchApp:
    clearState: true

- assertVisible: "Sign In"

- tapOn:
    text: "El. pašto adresas"
- inputText: "wrong@example.com"

- tapOn:
    text: "Slaptažodis"
- inputText: "wrongpassword"


- tapOn: "Sign In"

# The app should show an error — stay on login screen
- extendedWaitUntil:
    visible:
      text: "Failed to sign in"
    timeout: 8000

- assertVisible: "Sign In"
- assertNotVisible: "Home"
