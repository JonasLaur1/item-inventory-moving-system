appId: com.jonaslaur.boxit
---
# TC-12: Box QR code modal
# Verifies that opening the QR modal on a box detail screen displays
# the QR image and the descriptive text.
# Prerequisites: "Kitchen Essentials" box exists (run TC-07).

- launchApp:
    clearState: true

- assertVisible: "Sign In"

- tapOn:
    text: "El. pašto adresas"
- inputText: "boxit.test@gmail.com"

- tapOn:
    text: "Slaptažodis"
- inputText: "BoxitTest123!"

- tapOn: "Sign In"

- extendedWaitUntil:
    visible:
      text: "Home"
    timeout: 8000

# Navigate to the box
- tapOn:
    text: "Locations"
- waitForAnimationToEnd
- tapOn: "Maestro Test Home"
- waitForAnimationToEnd
- tapOn: "Kitchen"
- waitForAnimationToEnd
- tapOn: "Kitchen Essentials"
- waitForAnimationToEnd

- assertVisible: "Box Details"

# Open QR modal — button label comes from modals.qrTitle indirectly;
# the trigger button typically shows a QR icon. Try tapping visible "QR" text
# or an icon-button labelled with accessibilityLabel.
- tapOn: "QR"

- extendedWaitUntil:
    visible:
      text: "Box QR label"
    timeout: 5000

- assertVisible: "Box QR label"
- assertVisible: "Scan this QR code to open the box directly in the app."

# Close the modal
- tapOn: "Close"

- waitForAnimationToEnd
- assertNotVisible: "Box QR label"
