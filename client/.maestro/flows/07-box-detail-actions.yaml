appId: com.jonaslaur.boxit
---
# TC-07: Box detail — edit box name and delete an item
# Prerequisites: "Kitchen Box #1" exists with item "Coffee Maker" (run TC-05, TC-06).
# Verifies:
#   a) Editing the box name through the Edit modal
#   b) Deleting an item via the delete confirmation dialog

- launchApp:
    clearState: true

- assertVisible: "Sign In"

- tapOn:
    text: "El. pašto adresas"
- inputText: "boxit.test@gmail.com"

- tapOn:
    text: "Slaptažodis"
- inputText: "BoxitTest123!"

- tapOn: "Sign In"

- extendedWaitUntil:
    visible:
      text: "Home"
    timeout: 8000

# Navigate to the box
- tapOn:
    text: "Locations"
- waitForAnimationToEnd
- tapOn: "Maestro Test Home"
- waitForAnimationToEnd
- tapOn: "Kitchen"
- waitForAnimationToEnd
- tapOn: "Kitchen Box #1"
- waitForAnimationToEnd

- assertVisible: "Box Details"

# --- Part A: Edit box name ---
- tapOn: "Edit"

- assertVisible: "Edit box"

- tapOn:
    text: "Box name"
- eraseText
- inputText: "Kitchen Essentials"


- tapOn: "Save"

- waitForAnimationToEnd

# Updated name should be visible in the header / card
- assertVisible: "Kitchen Essentials"

# --- Part B: Delete item ---
- assertVisible: "Coffee Maker"

# Long-press or tap the delete icon on the item row
- longPressOn: "Coffee Maker"

# A confirmation modal should appear
- extendedWaitUntil:
    visible:
      text: "Delete item?"
    timeout: 5000

- tapOn: "Delete"

- waitForAnimationToEnd

# Item should no longer appear in the list
- assertNotVisible: "Coffee Maker"
