appId: com.jonaslaur.boxit
---
# TC-09: Activity feed — search and time-window filter
# Verifies that the Activity tab displays events and that the search
# and time-window controls filter the visible list correctly.

- launchApp:
    clearState: true

- assertVisible: "Sign In"

- tapOn:
    text: "El. pašto adresas"
- inputText: "boxit.test@gmail.com"

- tapOn:
    text: "Slaptažodis"
- inputText: "BoxitTest123!"

- tapOn: "Sign In"

- extendedWaitUntil:
    visible:
      text: "Home"
    timeout: 8000

- tapOn: "Activity"

- waitForAnimationToEnd

- assertVisible: "Activity"

# There should be events from the previous test cases
- assertVisible: "Events"

# --- Search ---
- tapOn:
    text: "Search activity, location, room, or box"
- inputText: "Kitchen"

- waitForAnimationToEnd

# Results should be scoped to "Kitchen"
- assertVisible: "Kitchen"

# Clear the search
- eraseText
- tapOn: "Activity"

- waitForAnimationToEnd

# --- Time-window filter ---
# Switch to "3d" window
- tapOn: "3d"

- waitForAnimationToEnd

- assertVisible: "3d"

# Switch to "7d" window
- tapOn: "7d"

- waitForAnimationToEnd

- assertVisible: "7d"

# Switch to "24h" window
- tapOn: "24h"

- waitForAnimationToEnd

# --- Type filter: Created ---
- tapOn: "Created"

- waitForAnimationToEnd

# Events of type "location_created" / "box_created" etc. should appear
- assertVisible: "Created"

# Reset to All
- tapOn: "All"

- waitForAnimationToEnd
