appId: com.jonaslaur.boxit
---
# TC-04: Create a location with rooms
# Verifies the full two-step location creation modal:
#   Step 1 — enter location name
#   Step 2 — pick room suggestions and confirm

- launchApp:
    clearState: true

- assertVisible: "Sign In"

- tapOn:
    text: "El. pašto adresas"
- inputText: "boxit.test@gmail.com"

- tapOn:
    text: "Slaptažodis"
- inputText: "BoxitTest123!"

- tapOn: "Sign In"

- extendedWaitUntil:
    visible:
      text: "Home"
    timeout: 8000

# Navigate to Locations tab
- tapOn:
    text: "Locations"

- waitForAnimationToEnd

# Open create-location modal
- tapOn: "Create Location"

- assertVisible: "New Location"
- assertVisible: "Give your location a name (e.g. New Apartment, Storage Unit)."

# Enter location name
- tapOn:
    text: "Location name (e.g. Home)"
- inputText: "Maestro Test Home"


- tapOn: "Next"

# Step 2 — pick room suggestions
- assertVisible: "Add Rooms"

- tapOn: "Kitchen"
- tapOn: "Bedroom"
- tapOn: "Living Room"

- tapOn: "Create"

- waitForAnimationToEnd

# The new location card should appear in the grid
- assertVisible: "Maestro Test Home"
