appId: com.jonaslaur.boxit
---
# TC-06: Add an item to a box via the Add Item tab
# Prerequisites: at least one box exists (run TC-05 first).
# Verifies the Add Item form: name, quantity, fragility toggle, box selection,
# and that the item appears in the box detail screen afterwards.

- launchApp:
    clearState: true

- assertVisible: "Sign In"

- tapOn:
    text: "El. pašto adresas"
- inputText: "boxit.test@gmail.com"

- tapOn:
    text: "Slaptažodis"
- inputText: "BoxitTest123!"

- tapOn: "Sign In"

- extendedWaitUntil:
    visible:
      text: "Home"
    timeout: 8000

# Tap the central + tab (Add Item)
- tapOn: "Add Item"

- waitForAnimationToEnd

- assertVisible: "Add Item"

# Enter item name
- tapOn:
    text: "Item name"
- inputText: "Coffee Maker"


# Set quantity to 2
- tapOn:
    text: "Quantity"
- eraseText
- inputText: "2"


# Add optional notes
- tapOn:
    text: "Notes (optional)"
- inputText: "Handle with care"


# Toggle fragility — tap the "Fragile" option
- tapOn: "Fragile"

# The box selector loads grouped by location/room.
# Tap the first available box (Kitchen Box #1).
- extendedWaitUntil:
    visible:
      text: "Kitchen Box #1"
    timeout: 6000
- tapOn: "Kitchen Box #1"

- tapOn: "Add"

- waitForAnimationToEnd

# Verify the item was created by navigating to the box
- tapOn:
    text: "Locations"

- waitForAnimationToEnd

- tapOn: "Maestro Test Home"

- waitForAnimationToEnd

- tapOn: "Kitchen"

- waitForAnimationToEnd

- tapOn: "Kitchen Box #1"

- waitForAnimationToEnd

- assertVisible: "Items in this box"
- assertVisible: "Coffee Maker"
